name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (empty = no release)'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Resolve modules
        run: |
          go get github.com/Nemu-x/desync@v0.2.1
          go mod tidy
          go version
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/mahak-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o dist/mahak-armv7 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/mahak-amd64 .
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mahak
          path: dist/*
      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Mahak ${{ inputs.release_tag }}
          prerelease: true
          files: dist/*
